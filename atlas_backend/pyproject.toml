[project]
name = "atlas-backend"
version = "1.0.0"
description = "Habitat telemetry assistant — grounded, read-only, streaming."
requires-python = ">=3.11"
authors = [{name = "Gianmarco Scalabrin"}]
maintainers = [{name = "Gianmarco Scalabrin"}]
license = "Apache-2.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# B008 flags calls in argument defaults. That is exactly how FastAPI declares a
# dependency — `db = Depends(get_db)` — so it fires on every route and means
# nothing here.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# The system prompt is a literal string. Reflowing it to satisfy the line
# length would put newlines into what the model actually reads.
"app/services/prompt.py" = ["E501"]
