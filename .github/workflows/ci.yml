name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_release.py --staged --history
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: atlas_backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: atlas_backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m ruff check .
      - run: python -m pytest
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas_frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: atlas_frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate

  backend-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r atlas_backend/requirements.txt -r atlas_backend/requirements-voice.txt
